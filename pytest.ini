[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test discovery
collect_ignore = [
    "venv",
    "logs",
    "__pycache__"
]

# Output options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings"
]

# Markers
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "auth: Authentication related tests",
    "users: User management tests",
    "sessions: Session management tests",
    "permissions: Permission tests",
    "audit: Audit logging tests"
]

# Coverage
[tool.coverage.run]
source = ["services", "routes", "models", "utils", "schemas"]
omit = [
    "venv/*",
    "tests/*",
    "logs/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
