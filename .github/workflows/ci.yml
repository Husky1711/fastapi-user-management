name: CI

on:
  pull_request:
  push:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.10"  # same as the Dockerfile; uv.lock's format depends on it

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usermgmt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      RUN_SERVICE_TESTS: "1"
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@localhost:5432/usermgmt_test
      REDIS__URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: "2.3-01/02/04/07/08 Migrations: round trip, concurrent upgrades, guarded downgrade, no-op repeat"
        env:
          PSQL_URL: postgresql://postgres:postgres@localhost:5432/usermgmt_test
        run: |
          leftovers() {
            psql "$PSQL_URL" -tAc "
              SELECT 'table ' || tablename FROM pg_tables
                WHERE schemaname = 'public' AND tablename <> 'alembic_version'
              UNION ALL
              SELECT 'function ' || p.proname FROM pg_proc p
                WHERE p.pronamespace = 'public'::regnamespace
                  AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = p.oid AND d.deptype = 'e')
              UNION ALL
              SELECT 'extension ' || extname FROM pg_extension WHERE extname = 'citext'"
          }
          uv run alembic upgrade head
          test "$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public'")" = 11
          uv run alembic downgrade base
          left=$(leftovers); echo "left after downgrade: [$left]"; test -z "$left"
          echo "2.3-07: two upgrades at once on an empty database (the advisory lock serialises them)"
          uv run alembic upgrade head > first.log 2>&1 & first=$!
          uv run alembic upgrade head > second.log 2>&1 & second=$!
          wait "$first"; wait "$second"
          cat first.log second.log
          migrations=$(ls migrations/versions/*.py | wc -l)
          test "$(cat first.log second.log | grep -c 'Running upgrade')" = "$migrations"  # each once
          test "$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM roles")" = 3
          echo "2.3-08: downgrading the seed is refused while a membership uses a system role"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, email, password_hash) VALUES (gen_random_uuid(), 'm@example.com', 'x');
            INSERT INTO organizations (id, name, slug) VALUES (gen_random_uuid(), 'Acme', 'acme');
            INSERT INTO memberships (id, user_id, organization_id, role_id)
              SELECT gen_random_uuid(), u.id, o.id, r.id FROM users u, organizations o, roles r
              WHERE r.key = 'member' AND r.organization_id IS NULL"
          if uv run alembic downgrade 0001; then echo "downgrade should have been refused"; exit 1; fi
          uv run alembic current | tee /dev/stderr | grep -q "^0002"  # the seed is still there
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users; DELETE FROM organizations"
          echo "3.2-01: migration 0003 backfills sessions written before it"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (id, email, password_hash)
              VALUES ('00000000-0000-4000-8000-000000000001', 'old@example.com', 'x');
            INSERT INTO sessions (id, user_id, family_id, token_hash, created_at, expires_at, revoked_at)
            SELECT gen_random_uuid(), '00000000-0000-4000-8000-000000000001',
                   '00000000-0000-4000-8000-0000000000f1', sha256(v::bytea),
                   now() - (v || ' hours')::interval, now() + interval '1 day',
                   CASE WHEN v = 'x' THEN now() END
            FROM unnest(ARRAY['3', '2', '1']) v;
            -- 3.2-01b: two active rows of one family written in the same instant
            INSERT INTO sessions (id, user_id, family_id, token_hash, created_at, expires_at)
            SELECT gen_random_uuid(), '00000000-0000-4000-8000-000000000001',
                   '00000000-0000-4000-8000-0000000000f2', sha256(('tie' || v)::bytea),
                   timestamptz '2026-01-01 00:00:00+00', now() + interval '1 day'
            FROM unnest(ARRAY['a', 'b']) v"
          uv run alembic upgrade head
          psql "$PSQL_URL" -tAc "
            SELECT bool_and(active = 1 AND first_ok) AND sum(rotated) = 3 FROM (
              SELECT count(*) FILTER (WHERE revoked_at IS NULL) AS active,
                     count(*) FILTER (WHERE revoked_reason = 'rotated') AS rotated,
                     bool_and(family_started_at = (SELECT min(created_at) FROM sessions m
                                                   WHERE m.family_id = s.family_id)) AS first_ok
              FROM sessions s GROUP BY family_id) f" | tee /dev/stderr | grep -qx t
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users"
          uv run alembic upgrade head 2>&1 | tee second-run.log
          if grep -q "Running upgrade" second-run.log; then echo "second upgrade did work"; exit 1; fi
          uv run alembic current | tee /dev/stderr | grep -q "(head)"
      - name: "2.3-10 Migration against an unresponsive host gives up after the connect timeout"
        run: |
          start=$(date +%s)
          if DATABASE__URL="postgresql+asyncpg://app:Unused-Pw-91@10.255.255.1:5432/app" \
             DATABASE__CONNECT_TIMEOUT_SECONDS=1 timeout 30 uv run alembic upgrade head > slow.log 2>&1
          then echo "migration should have failed"; exit 1; fi
          took=$(( $(date +%s) - start ))
          tail -2 slow.log; echo "took ${took}s"
          grep -q "TimeoutError" slow.log
          test "$took" -lt 15
          if grep -q "Unused-Pw-91" slow.log; then echo "password printed"; exit 1; fi
      - name: Run tests
        run: >-
          uv run pytest
          --junitxml=reports/junit.xml
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov
      - name: Publish test report to the run summary
        if: always()
        run: uv run python scripts/test_report.py "Unit & integration" reports/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      WAIT: scripts/ci/wait-for-status.sh
    steps:
      - uses: actions/checkout@v4
      - name: "1.1-03 README quick start: copy .env.example, start the stack (detached)"
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 120
          $WAIT http://localhost:8000/health/ready 200 30
      - name: "2.3-05 Operator applies migrations on the stack; schema and seed data exist"
        run: |
          docker compose exec -T app alembic upgrade head
          docker compose exec -T db psql -U postgres -d usermgmt -tAc \
            "SELECT string_agg(key, ',' ORDER BY key) FROM roles WHERE organization_id IS NULL" \
            | tee /dev/stderr | grep -qx "admin,member,owner"
          $WAIT http://localhost:8000/health/ready 200 10
      - name: "2.3-06 Migration with a wrong DB password fails clearly, without printing it"
        run: |
          set +e
          out=$(docker compose run --rm --no-deps \
            -e DATABASE__URL="postgresql+asyncpg://postgres:Wrong-Pw-7731@db:5432/usermgmt" \
            app alembic upgrade head 2>&1)
          code=$?
          set -e
          echo "$out" | tail -3
          test "$code" -ne 0
          echo "$out" | grep -q "password authentication failed"
          if echo "$out" | grep -q "Wrong-Pw-7731"; then echo "password printed"; exit 1; fi
      - name: "2.6-12 Operator creates the first admin on the stack; a second run changes nothing"
        run: |
          echo 'Stack-Admin-Passw0rd' \
            | docker compose exec -T app python -m app.cli create-admin --email ops@example.com \
            | tee created.txt
          grep -q 'Created platform admin o\*\*\*@example.com' created.txt
          docker compose exec -T db psql -U postgres -d usermgmt -tAc \
            "SELECT is_platform_admin AND email_verified AND password_hash LIKE '\$argon2id\$%'
             FROM users WHERE email = 'OPS@example.com'" | tee /dev/stderr | grep -qx t
          hash_of() {
            docker compose exec -T db psql -U postgres -d usermgmt -tAc \
              "SELECT md5(password_hash) FROM users WHERE email = 'ops@example.com'"
          }
          before=$(hash_of)
          set +e
          echo 'Other-Passw0rd-123' \
            | docker compose exec -T app python -m app.cli create-admin --email ops@example.com
          code=$?
          set -e
          test "$code" -eq 1
          test "$(hash_of)" = "$before"
      - name: "3.3-09, 3.4-17, 3.5-13, 3.6-12 A user signs up, logs in, refreshes and changes password on the stack"
        run: |
          api=http://localhost:8000/api/v1
          post() { curl -s -o body.json -w '%{http_code}' -X POST "$api$1" -H 'Content-Type: application/json' "${@:3}" -d "$2"; }
          email="stack-$(date +%s)@example.com"
          test "$(post /auth/signup "{\"email\":\"$email\",\"password\":\"Stack-Passw0rd-123\"}")" = 202
          # A spoofed X-Forwarded-For from an untrusted client must not become the session's IP.
          test "$(post /auth/login "{\"email\":\"$email\",\"password\":\"Stack-Passw0rd-123\"}" \
            -H 'X-Forwarded-For: 198.51.100.66')" = 200
          access=$(jq -r .access_token body.json); first_refresh=$(jq -r .refresh_token body.json)
          auth=(-H "Authorization: Bearer $access")
          test "$(curl -s -o me.json -w '%{http_code}' "${auth[@]}" $api/me)" = 200
          test "$(jq -r .email me.json)" = "$email"
          ip=$(curl -s "${auth[@]}" $api/me/sessions | jq -r '.items[0].ip')
          echo "session ip: $ip"
          echo "$ip" | grep -Eq '^[0-9a-f.:]+$'   # a real address was recorded...
          test "$ip" != "198.51.100.66"           # ...and it isn't the spoofed one
          test "$(post /auth/refresh "{\"refresh_token\":\"$first_refresh\"}")" = 200
          second_refresh=$(jq -r .refresh_token body.json)
          test "$(post /auth/refresh "{\"refresh_token\":\"$first_refresh\"}")" = 401   # replay
          test "$(post /auth/refresh "{\"refresh_token\":\"$second_refresh\"}")" = 401  # family revoked
          test "$(post /auth/login "{\"email\":\"$email\",\"password\":\"Stack-Passw0rd-123\"}")" = 200
          access=$(jq -r .access_token body.json)
          test "$(post /me/password '{"current_password":"Stack-Passw0rd-123","new_password":"Stack-Passw0rd-456"}' \
            -H "Authorization: Bearer $access")" = 204
          test "$(post /auth/login "{\"email\":\"$email\",\"password\":\"Stack-Passw0rd-123\"}")" = 401
          test "$(post /auth/login "{\"email\":\"$email\",\"password\":\"Stack-Passw0rd-456\"}")" = 200
          if docker compose logs app | grep -q "Stack-Passw0rd"; then echo "password in logs"; exit 1; fi
          if docker compose logs app | grep -q "$first_refresh"; then echo "token in logs"; exit 1; fi
      - name: "1.6-02 Container runs as a non-root user"
        run: |
          uid=$(docker compose exec -T app id -u)
          echo "uid=$uid"; test "$uid" != "0"
      - name: "1.6-03 Image contains no tests, docs, env files or git data"
        run: docker compose exec -T app sh -c 'test ! -e /app/tests && test ! -e /app/docs && test ! -e /app/.env && test ! -e /app/.git'
      - name: "1.6-10 Ports are published on loopback only; Redis refuses clients without the password"
        run: |
          for svc in "app 8000" "db 5432" "redis 6379"; do
            set -- $svc
            addr=$(docker compose port "$1" "$2")
            echo "$1 -> $addr"
            case "$addr" in 127.0.0.1:*) ;; *) echo "$1 is not bound to loopback"; exit 1 ;; esac
          done
          docker compose exec -T -e REDISCLI_AUTH= redis redis-cli ping | tee /dev/stderr | grep -q NOAUTH
      - name: "1.6-09 A setting edited in .env reaches the app"
        run: |
          echo 'CORS__ALLOW_ORIGINS=["http://localhost:3000"]' >> .env
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec -T app sh -c 'echo "$CORS__ALLOW_ORIGINS"' | grep -q "http://localhost:3000"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: User scenarios against the running stack (gate check 3)
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_ALLOWED_ORIGIN: http://localhost:3000
        run: |
          uv sync --locked
          uv run pytest tests/e2e --no-cov -v --junitxml=reports/e2e-junit.xml
      - name: Publish user-scenario report to the run summary
        if: always()
        run: uv run python scripts/test_report.py "User scenarios (real stack)" reports/e2e-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload user-scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/
      - name: "1.5-13 Redis down -> not ready (503), live still 200; Redis back -> ready (200)"
        run: |
          docker compose stop redis
          $WAIT http://localhost:8000/health/ready 503 15
          $WAIT http://localhost:8000/health/live 200 5
          docker compose start redis
          $WAIT http://localhost:8000/health/ready 200 30
      - name: "1.5-14 PostgreSQL down -> not ready (503), live still 200; back -> ready (200)"
        run: |
          docker compose stop db
          $WAIT http://localhost:8000/health/ready 503 15
          $WAIT http://localhost:8000/health/live 200 5
          docker compose start db
          $WAIT http://localhost:8000/health/ready 200 60
      - name: "1.5-19 Outage logs from 1.5-13/14: one line per failing dependency, no traceback"
        run: |
          logs=$(docker compose logs app)
          echo "$logs" | grep '"readiness check failed"' | head -5
          test "$(echo "$logs" | grep -c '"readiness check failed"')" -ge 2
          if echo "$logs" | grep -q 'postgres:postgres@\|redis-dev-password'; then echo "credentials in logs"; exit 1; fi
          if echo "$logs" | grep '"readiness check failed"' | grep -q 'Traceback'; then echo "traceback in logs"; exit 1; fi
      - name: "1.5-21 Wrong DB password: not ready, and the password never reaches the logs"
        run: |
          docker compose run --detach --no-deps --name app-badpw --publish 8002:8000 \
            -e DATABASE__URL="postgresql+asyncpg://postgres:Wrong-Pw-7731@db:5432/usermgmt" app
          $WAIT http://localhost:8002/health/live 200 30
          $WAIT http://localhost:8002/health/ready 503 10
          logs=$(docker logs app-badpw 2>&1)
          echo "$logs" | grep '"readiness check failed"' | head -3
          echo "$logs" | grep -q '"readiness check failed"'
          if echo "$logs" | grep -q 'Wrong-Pw-7731'; then echo "password in logs"; exit 1; fi
          if echo "$logs" | grep -q 'Traceback'; then echo "traceback in logs"; exit 1; fi
          docker rm -f app-badpw
      - name: "1.5-18 App started while PostgreSQL is down: starts, not ready; ready once the DB is back"
        run: |
          docker compose stop db
          docker compose up --detach --no-deps --force-recreate app
          $WAIT http://localhost:8000/health/live 200 30
          $WAIT http://localhost:8000/health/ready 503 5
          docker compose start db
          $WAIT http://localhost:8000/health/ready 200 60
      - name: "1.2-21 Production with safe settings starts, sends HSTS, hides docs"
        run: |
          docker compose exec -T db psql -U postgres -c "CREATE ROLE app_ci LOGIN PASSWORD 'ci-strong-password'"
          docker compose exec -T redis redis-cli ACL SETUSER app_ci on '>ci-strong-redis-password' '~*' '&*' '+@all'
          secret=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          docker compose run --detach --no-deps --name app-prod --publish 8001:8000 \
            -e ENVIRONMENT=production -e JWT__SECRET_KEY="$secret" \
            -e DATABASE__URL="postgresql+asyncpg://app_ci:ci-strong-password@db:5432/usermgmt" \
            -e REDIS__URL="redis://app_ci:ci-strong-redis-password@redis:6379/0" app
          $WAIT http://localhost:8001/health/ready 200 30
          curl -s -D - -o /dev/null http://localhost:8001/health/live | grep -qi "^strict-transport-security: max-age"
          $WAIT http://localhost:8001/docs 404 5
          $WAIT http://localhost:8001/openapi.json 404 5
          docker rm -f app-prod
      - name: "1.2-20 Production refuses to start with the published default secret and passwords"
        run: |
          set +e
          output=$(docker compose run --rm --no-deps -e ENVIRONMENT=production app 2>&1)
          status=$?
          set -e
          echo "$output" | tail -5
          test "$status" -ne 0
          echo "$output" | grep -q "Unsafe configuration for production"
          echo "$output" | grep -q "JWT__SECRET_KEY is the development default"
          echo "$output" | grep -q "DATABASE__URL uses a well-known default password"
          echo "$output" | grep -q "REDIS__URL uses a well-known default password"
      - name: Container logs
        if: always()
        run: docker compose logs app
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
