name: CI

on:
  pull_request:
  push:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usermgmt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      RUN_SERVICE_TESTS: "1"
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@localhost:5432/usermgmt_test
      REDIS__URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --cov-report=xml

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Readiness probe returns 200
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/ready
          echo
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: User scenarios against the running stack (milestone gate check 3)
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          uv sync
          uv run pytest tests/e2e --no-cov -v
      - name: "Operator scenario: Redis down -> not ready (503), Redis back -> ready (200)"
        run: |
          docker compose stop redis
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready)
          echo "with Redis stopped: $code"; test "$code" = "503"
          docker compose start redis
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready)
            [ "$code" = "200" ] && break; sleep 1
          done
          echo "after Redis restart: $code"; test "$code" = "200"
      - name: "Operator scenario: production refuses to start with unsafe defaults"
        run: |
          set +e
          output=$(docker compose run --rm --no-deps -e ENVIRONMENT=production app 2>&1)
          status=$?
          set -e
          echo "$output" | tail -5
          test "$status" -ne 0
          echo "$output" | grep -q "Unsafe production configuration"
      - name: Container logs
        if: always()
        run: docker compose logs app
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
