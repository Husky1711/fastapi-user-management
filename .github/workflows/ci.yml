name: CI

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master, feature/**]

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fastapi_users
          MYSQL_USER: fastapi
          MYSQL_PASSWORD: fastapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql+pymysql://fastapi:fastapi@127.0.0.1:3306/fastapi_users
      DB__URL: mysql+pymysql://fastapi:fastapi@127.0.0.1:3306/fastapi_users
      REDIS__HOST: 127.0.0.1
      REDIS__PORT: "6379"
      REDIS__SOCKET_CONNECT_TIMEOUT: "1"
      GITHUB_ACTIONS: "true"
      SECURITY__ALLOW_PUBLIC_SIGNUP: "false"
      SECURITY__ALLOW_DEBUG_AUTH: "false"
      JWT__SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      AUTH_COOKIE__USE_HTTPONLY_REFRESH: "false"
      AUTH_COOKIE__LEGACY_JSON_REFRESH: "true"
      RATE_LIMIT__ENABLE_IP_LIMITS: "false"
      RATE_LIMIT__ENABLE_USER_LIMITS: "false"
      # .env in repo sets login limit to 10/min; smoke suite issues ~16 logins
      RATE_LIMIT__ENDPOINT_LIMITS__LOGIN__MINUTE: "100"
      RATE_LIMIT__ENDPOINT_LIMITS__LOGIN__HOUR: "1000"
      RATE_LIMIT__ENDPOINT_LIMITS__REFRESH__MINUTE: "100"
      RATE_LIMIT__ENDPOINT_LIMITS__DASHBOARD__MINUTE: "100"
      RATE_LIMIT__ENDPOINT_LIMITS__USERS_LIST__MINUTE: "100"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap database
        run: python scripts/ci_bootstrap_db.py

      - name: Verify CI test settings
        run: |
          python -c "from config.settings import settings; print('login_limit', settings.rate_limit.endpoint_limits.get('login')); print('ip_limits', settings.rate_limit.enable_ip_limits); print('httponly', settings.auth_cookie.use_httponly_refresh)"

      - name: Verify CI seed fixtures
        run: python scripts/verify_ci_seed.py

      - name: ADR-002 browser auth checklist
        run: python scripts/curl_auth_checklist.py
        env:
          AUTH_COOKIE__USE_HTTPONLY_REFRESH: "true"
          AUTH_COOKIE__LEGACY_JSON_REFRESH: "true"
          AUTH_COOKIE__SECURE: "false"
          SECURITY__CORS_ORIGINS: '["http://localhost:5173"]'
          CHECKLIST_ORIGIN: "http://localhost:5173"

      - name: List smoke tests
        run: python -c "import pytest; raise SystemExit(pytest.main(['--confcutdir=tests/smoke','tests/smoke','-m','smoke','--collect-only','-q']))"

      - name: Run smoke tests
        run: |
          python scripts/smoke_auth_probe.py 2>&1 | tee smoke-output.txt

      - name: Upload smoke output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-output.txt

      - name: Summarize smoke failure
        if: failure()
        run: |
          echo "## Smoke test output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 smoke-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests (role scope + auth deps)
        if: always()
        run: |
          pytest tests/unit/test_role_scope.py
          pytest tests/unit/test_auth_dependencies.py
          pytest tests/unit/test_cookie_auth.py
          pytest tests/unit/test_browser_auth_contract.py
