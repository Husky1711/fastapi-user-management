# Helm values — must match repository.url and repository.branch in codespaces.yaml

repository:
  url: https://github.com/Husky1711/fastapi-user-management.git
  branch: feature/codespaces-local-db

# Load-tested (1 worker, 1 CPU, 2 threads): ~60 req/s per pod; 3 pods ~150 req/s,
# which covers the 1,000-2,000-user target with headroom. Scale replicas, not threads.
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6          # keep maxReplicas x 20 DB connections < MySQL max_connections
  targetCPUUtilizationPercentage: 70

image:
  repository: ghcr.io/husky1711/fastapi-user-management
  tag: feature-codespaces-local-db
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  host: api.example.com

env:
  APP__HOST: "0.0.0.0"
  APP__PORT: "9000"
  APP__ENVIRONMENT: "staging"
  REDIS__HOST: "redis"
  # Per-process capacity: 1 worker x 2 threads; DB pool 10+10 = 20 connections/pod.
  # In-flight requests are capped at pool-2 per process (no pool deadlock).
  WEB_CONCURRENCY: "1"
  APP__THREADPOOL_SIZE: "2"
  DATABASE__POOL_SIZE: "10"
  DATABASE__MAX_OVERFLOW: "10"
  # DATABASE_URL (or DB__URL) from a Kubernetes Secret in real deployments

probes:
  liveness: /health/live
  readiness: /health/ready

# 1 full CPU per pod: bcrypt login ~250 ms CPU; 500m throttled pods to ~2 logins/s.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: "1"
    memory: 384Mi

# See docs/CONTAINER_HARDENING.md — image USER is 10001.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Required when readOnlyRootFilesystem is true
tmpVolume:
  enabled: true
  mountPath: /tmp

# Logical mysqldump CronJob — see docs/BACKUP_RESTORE.md (prefer managed PITR in prod)
# Write dumps to a persistent volume / object storage (BACKUP_DIR), never the repo.
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 30
  mountPath: /backups
