# Local development stack: app + PostgreSQL + Redis.
#   make run        (or: docker compose up --build)
# Values come from .env when present; the defaults below are for local use only.

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    # Every app setting comes from .env (copied from .env.example). Optional, so the stack also
    # starts without one, using the app's development defaults.
    env_file:
      - path: .env
        required: false
    # Only the addresses that differ inside the Compose network are set here; they override the
    # localhost values in .env.
    environment:
      DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-usermgmt}
      REDIS__URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-usermgmt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
