[project]
name = "fastapi-user-management"
version = "0.1.0"
description = "Reusable, production-grade user-management backend: auth, organizations, roles & permissions, sessions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Runtime dependencies are added in the roadmap step that first needs them
# (see docs/ARCHITECTURE.md §1). Keep this list minimal.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "redis>=5.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# This is an application, not a library: dependencies are installed, the project itself is not.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "T20",      # no print
    "RUF",      # ruff-specific
]
# HTTP-style error names (NotFound, Conflict) read better than NotFoundError at call sites.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]  # asserts, dummy secrets, git calls

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "services: needs real PostgreSQL and Redis (set RUN_SERVICE_TESTS=1)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this, lines after its awaits look untested.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
